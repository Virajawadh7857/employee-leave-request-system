services:

  # MySQL database
  mysql:
    image: mysql:8.4
    container_name: leave-request-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: leave_request_db
      MYSQL_USER: leave_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Spring Boot backend
  backend:
    image: leave-request-backend:local

    build:
      context: .
      dockerfile: Dockerfile

    container_name: leave-request-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/leave_request_db
      SPRING_DATASOURCE_USERNAME: leave_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

  # Angular frontend served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: leave-request-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

  # Jenkins CI server
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins

    image: leave-request-jenkins:local
    container_name: leave-request-jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - jenkins_home:/var/jenkins_home

    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -Djava.awt.headless=true"

      # Allows backend tests to connect to the Docker MySQL service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/leave_request_db
      SPRING_DATASOURCE_USERNAME: leave_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  jenkins_home: